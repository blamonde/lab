<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const STORAGE_KEY='principal-cac-lab-v06';
const TYPE_DEFAULTS={main:'Prizes\nannouncement',secondary:'Musical Instrument Bank\ncompetition winners',label:'Discover',color:'#ECEAE7'};

const palette=[['Blanc fumée','#ECEAE7'],['Bleu','#196FF0'],['Vert','#15BE09'],['Orange','#F36317'],['Rouge','#E52249'],['Jaune','#EBC40F'],['Bleu clair','#E0F0FF'],['Céladon','#B6D3AE'],['Marron','#917A37'],['Rose','#FFC3F2'],['Jaune clair','#F8F287'],['Blanc','#FFFFFF'],['Noir','#000000']];
let state={template:'type',format:'portrait',color:'#ECEAE7',image:null,photoColor:'#FFC3F2'},generation=0,drag=null;const photoTemplates=['photo','free','portrait','boxed','name','bottom'];const figmaNumbers={photo:'01',type:'02',free:'03',portrait:'04',boxed:'05',name:'06',bottom:'07'};const defaults={photo:{label:'Discover',title:'Prix\nJohn-Hobday\n2024',color:'#FFC3F2'},free:{label:'',title:'',color:'#ECEAE7'},portrait:{label:'Discover',title:'Aaron\nJ.Williams',color:'#FFC3F2'},boxed:{label:'',title:'Canadian\nIcon',color:'#B6D3AE'},name:{label:'Russell Wangersky',title:'',color:'#F36317'},bottom:{label:'CEO Letter to the Arts Community',title:'',color:'#196FF0'}};
function luminance(hex){const c=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function bestInk(bg){return contrast(bg,'#000000')>=contrast(bg,'#FFFFFF')?'#000000':'#FFFFFF'}
function lines(text){return text.split('\n').map(x=>x.trim()).filter(Boolean)}
function wrapText(value,size,maxWidth){
 ctx.font=`700 ${size}px Basel`;
 const result=[];
 for(const paragraph of value.split('\n')){
  if(!paragraph.trim()){result.push('');continue}
  let line='';
  for(const word of paragraph.trim().split(/\s+/)){
   const candidate=line?line+' '+word:word;
   if(ctx.measureText(candidate).width<=maxWidth){line=candidate;continue}
   if(line){result.push(line);line=''}
   if(ctx.measureText(word).width<=maxWidth){line=word;continue}
   // Long words and URLs: split by character so they cannot escape the canvas.
   let chunk='';for(const ch of word){if(chunk&&ctx.measureText(chunk+ch).width>maxWidth){result.push(chunk);chunk=''}chunk+=ch}line=chunk;
  }
  if(line)result.push(line);
 }
 return result;
}
function fittedText(value,x,y,width,height,desiredSize,minSize,ink,alignBottom=false){
 let size=desiredSize,arr=[];
 while(size>=minSize){arr=wrapText(value,size,width);if(arr.length*size<=height)break;size-=2}
 let errors=[];
 if(arr.length*size>height){errors.push('Le texte est trop long : raccourcissez-le pour ce format.');size=minSize;arr=wrapText(value,size,width)}
 const lineHeight=size;
 const top=alignBottom?y+height-arr.length*lineHeight:y;
 ctx.save();ctx.beginPath();ctx.rect(x,y,width,height);ctx.clip();ctx.font=`700 ${size}px Basel`;ctx.textBaseline='top';ctx.fillStyle=ink;
 arr.forEach((line,i)=>ctx.fillText(line,x,top+i*lineHeight));ctx.restore();
 return {height:arr.length*lineHeight,size,errors,lines:arr};
}
function imageCover(img,w,h){let zoom=+$('zoom').value,scale=Math.max(w/img.width,h/img.height)*zoom,iw=img.width*scale,ih=img.height*scale;return {x:-(iw-w)*(+$('panx').value/100),y:-(ih-h)*(+$('pany').value/100),w:iw,h:ih}}
function setCrop(zoom,panx,pany){$('zoom').value=Math.max(1,Math.min(3,zoom));$('panx').value=Math.max(0,Math.min(100,panx));$('pany').value=Math.max(0,Math.min(100,pany));sync()}
function zoomAt(nextZoom,px=.5,py=.5){
 const img=state.image;if(!img)return;
 const w=1080,h=state.format==='portrait'?1440:1080,old=imageCover(img,w,h);
 const oldZoom=+$('zoom').value,zoom=Math.max(1,Math.min(3,nextZoom));
 const ratio=zoom/oldZoom,oldX=old.x,oldY=old.y;
 // Preserve the image pixel under the pointer while changing scale.
 const newX=px*w-(px*w-oldX)*ratio,newY=py*h-(py*h-oldY)*ratio;
 const newW=old.w*ratio,newH=old.h*ratio;
 setCrop(zoom,newW>w?(100*-newX/(newW-w)):50,newH>h?(100*-newY/(newH-h)):50);
}
function drawPhoto(w,h,errors){let img=state.image;if(img){ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();let r=imageCover(img,w,h);ctx.drawImage(img,r.x,r.y,r.w,r.h);ctx.restore()}else{ctx.fillStyle='#c7c7c7';ctx.fillRect(0,0,w,h);errors.push('Photographie manquante : importer une image pour exporter.')}}
function drawLabel(value,x,y,color,maxWidth=980){if(!value.trim())return [];let ink=bestInk(color),size=50;ctx.font=`${size}px Echo`;while(ctx.measureText(value).width>maxWidth-50&&size>17){size-=1;ctx.font=`${size}px Echo`}let width=Math.min(maxWidth,ctx.measureText(value).width+50),height=87.1;ctx.fillStyle=color;ctx.fillRect(x,y,width,height);ctx.fillStyle=ink;ctx.textBaseline='middle';ctx.save();ctx.beginPath();ctx.rect(x+25,y,width-50,height);ctx.clip();ctx.fillText(value,x+25,y+height/2);ctx.restore();return ctx.measureText(value).width>maxWidth-50?['Étiquette trop longue : raccourcir le texte.']:[]}
function drawBoxedTitle(value,color,w,h){let rows=wrapText(value,150,w-100),size=150;while(size>46&&(rows.length*(size+60)+Math.max(0,rows.length-1)*10>h-80||rows.some(t=>{ctx.font=`700 ${size}px Basel`;return ctx.measureText(t).width>w-100}))){size-=2;rows=wrapText(value,size,w-100)}let y=40;for(const line of rows){ctx.font=`700 ${size}px Basel`;let bw=Math.min(w-80,ctx.measureText(line).width+50),bh=size+50;ctx.fillStyle=color;ctx.fillRect(40,y,bw,bh);ctx.fillStyle='#000';ctx.textBaseline='top';ctx.fillText(line,65,y+25);y+=bh+10}return y>h-20?['Titre trop long pour les aplats : raccourcir le contenu.']:[]}
async function render(){let seq=++generation;await Promise.all([document.fonts.load('700 150px Basel'),document.fonts.load('50px Echo')]);await document.fonts.ready;let w=1080,h=state.format==='portrait'?1440:1080;canvas.width=w;canvas.height=h;let errors=[],isType=state.template==='type',bg=isType?state.color:'#ECEAE7';ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
if(isType){
 const mainText=$('mainText').value,secondaryText=$('secondaryText').value;
 // Fit both text blocks together; wrap each paragraph and preserve the original
 // Basel scale unless their combined height requires a proportional reduction.
 let size=128.807,main=[],secondary=[],usable=h-50-205;
 while(size>=38){main=wrapText(mainText,size,980);secondary=wrapText(secondaryText,size,980);if((main.length+secondary.length)*size<=usable)break;size-=2}
 if((main.length+secondary.length)*size>usable)errors.push('Texte trop long même au corps minimum : raccourcir le contenu.');
 const mainH=main.length*size,secondaryH=secondary.length*size;
 const first=fittedText(mainText,50,50,980,Math.min(mainH,usable),size,size,'#000000');
 const remaining=Math.max(0,usable-first.height);
 const second=fittedText(secondaryText,50,50+first.height,980,remaining,size,size,'rgba(0,0,0,0.5)');

$('zoomValue').textContent=Math.round(+$('zoom').value*100)+' %';$('warning').textContent=errors.length?[...new Set(errors)].join(' · '):'';$('warning').style.color=errors.length?'#a34320':'#497e56';$('caption').textContent=`${state.format==='portrait'?'Portrait':'Carré'} · ${w} × ${h}`;return errors}
function sync(){

let savePending=false;
function scheduleSave(){if(savePending)return;savePending=true;queueMicrotask(()=>{savePending=false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify({template:state.template,format:state.format,color:state.color,photoColor:state.photoColor,mainText:$('mainText').value,secondaryText:$('secondaryText').value,photoTitle:$('photoTitle').value,labelText:$('labelText').value,zoom:$('zoom').value,panx:$('panx').value,pany:$('pany').value}));$('saveStatus').textContent='';$('saveStatus').hidden=true}catch(e){$('saveStatus').textContent='Enregistrement indisponible : exportez avant de fermer.';$('saveStatus').hidden=false}})}
function restoreSession(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!saved)return;const allowed=['photo','type','free','portrait','boxed','name','bottom'];if(allowed.includes(saved.template))state.template=saved.template;if(['portrait','square'].includes(saved.format))state.format=saved.format;if(palette.some(p=>p[1]===saved.color))state.color=saved.color;if(palette.some(p=>p[1]===saved.photoColor))state.photoColor=saved.photoColor;for(const id of ['mainText','secondaryText','photoTitle','labelText','zoom','panx','pany'])if(saved[id]!==undefined)$(id).value=saved[id];$('saveStatus').textContent='Brouillon restauré. Réimportez votre photo au besoin.';$('saveStatus').hidden=false}catch(e){$('saveStatus').textContent='';$('saveStatus').hidden=true}}

canvas.addEventListener('pointerdown',e=>{

});

 if(!drag||!state.image)return;
 const rect=canvas.getBoundingClientRect(),w=1080,h=state.format==='portrait'?1440:1080,r=imageCover(state.image,w,h);

 if(!photoTemplates.includes(state.template)||!state.image)return;
 e.preventDefault();const r=canvas.getBoundingClientRect();
 zoomAt(+$('zoom').value*(e.deltaY<0?1.075:1/1.075),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
},{passive:false});
function loadPhoto(f){
 if(!f)return;
 if(!f.type.startsWith('image/')){$('warning').textContent='Choisissez un fichier image.';return}
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{
   state.image=im;URL.revokeObjectURL(u);
   $('photoPicker').classList.add('has-photo');
   $('photoPickerTitle').textContent=f.name;
   $('photoPickerSubtitle').textContent='Modifier la photo';
   $('warning').textContent='';
   setCrop(1,50,50);
 };
 im.onerror=()=>{URL.revokeObjectURL(u);$('warning').textContent='Cette image ne peut pas être ouverte.'};
 im.src=u;
}
$('photoPickerButton').onclick=()=>$('upload').click();
