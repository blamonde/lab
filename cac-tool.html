<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCA - Image generator | CAC - Générateur d'images</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Typography Apple HIG */
    body, button, input, select, option { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; }
    
    /* Apple-like soft shadows and glassmorphism */
    .ios-shadow { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02); }
    .ios-glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(0,0,0,0.05); }
    
    /* Focus state minimal */
    .color-selected { transform: scale(1.15); box-shadow: 0 0 0 2px white, 0 0 0 4px #007AFF; }
    
    canvas { touch-action: none; }
    
    /* Segmented control transitions */
    .segment-btn { transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); }
  </style>
</head>
<body class="min-h-screen bg-[#F5F5F7] text-[#1D1D1F] antialiased relative selection:bg-[#007AFF] selection:text-white">

  <!-- Logo Header -->
  <div class="absolute top-6 left-6 md:top-10 md:left-10 z-20">
    <img id="header-logo" src="" alt="Logo" class="h-10 md:h-12 drop-shadow-sm" />
  </div>

  <!-- Main Container -->
  <div class="flex items-center justify-center pt-28 pb-20 px-4 md:px-8">
    <div class="w-full max-w-7xl">
      
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

        <!-- COLONNE 1 : CONTROLES -->
        <div class="bg-white p-8 rounded-[24px] ios-shadow flex flex-col gap-8 self-start">
          
          <!-- Langue (Segmented Control HIG) -->
          <div class="flex bg-[#F2F2F7] p-1 rounded-xl">
            <button id="btn-lang-en" class="segment-btn flex-1 py-1.5 text-[13px] font-medium rounded-lg">English</button>
            <button id="btn-lang-fr" class="segment-btn flex-1 py-1.5 text-[13px] font-medium rounded-lg">Français</button>
          </div>

          <!-- Intro -->
          <div class="flex flex-col gap-2">
            <h2 id="txt-title-main" class="text-2xl font-semibold tracking-tight text-black"></h2>
            <p id="txt-desc-main" class="text-[15px] text-[#3C3C43] leading-relaxed"></p>
            <p id="txt-desc-sub" class="text-[15px] text-[#3C3C43] leading-relaxed mt-1"></p>
          </div>

          <div class="h-px w-full bg-gray-100"></div>

          <!-- Format (Segmented Control) -->
          <div>
            <h3 id="lbl-format" class="text-[13px] font-semibold text-[#8E8E93] uppercase tracking-wider mb-3"></h3>
            <div class="flex bg-[#F2F2F7] p-1 rounded-xl">
              <button id="btn-format-post" class="segment-btn flex-1 py-2 text-[14px] font-medium rounded-lg flex items-center justify-center">
                <span id="txt-format-post"></span>
              </button>
              <button id="btn-format-story" class="segment-btn flex-1 py-2 text-[14px] font-medium rounded-lg flex items-center justify-center">
                <span id="txt-format-story"></span>
              </button>
            </div>
          </div>

          <!-- Couleurs -->
          <div>
            <h3 id="lbl-color" class="text-[13px] font-semibold text-[#8E8E93] uppercase tracking-wider mb-3"></h3>
            <div id="color-container" class="flex flex-wrap gap-4 pt-1">
              <!-- Injecté via JS -->
            </div>
          </div>
        </div>

        <!-- COLONNE 2 : IMAGE 1 -->
        <div class="bg-white p-8 rounded-[24px] ios-shadow flex flex-col gap-6">
          <div>
            <h2 id="title-img1" class="text-xl font-semibold tracking-tight mb-4 text-black"></h2>
            
            <label class="flex items-center justify-center w-full py-3.5 px-4 bg-[#F2F2F7] text-[#007AFF] font-medium text-[17px] rounded-xl cursor-pointer hover:bg-[#E5E5EA] active:scale-[0.98] transition-all">
              <i data-lucide="upload" class="w-5 h-5 mr-2"></i>
              <span id="lbl-file-input"></span>
              <input type="file" id="file-input" accept="image/*" class="sr-only" />
            </label>
          </div>

          <div class="relative w-full max-w-[320px] mx-auto rounded-[20px] overflow-hidden border border-black/5 bg-[#F2F2F7]">
            <canvas id="canvas1" class="w-full h-auto cursor-grab active:cursor-grabbing"></canvas>
          </div>

          <div>
            <button id="btn-dl-1" disabled class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl font-semibold text-[17px] transition-all bg-[#F2F2F7] text-[#C7C7CC] cursor-not-allowed">
              <i data-lucide="download" class="w-5 h-5 mr-2"></i>
              <span id="txt-dl-1"></span>
            </button>
          </div>
        </div>

        <!-- COLONNE 3 : IMAGE 2 -->
        <div class="bg-white p-8 rounded-[24px] ios-shadow flex flex-col gap-6">
          <div>
            <h2 id="title-img2" class="text-xl font-semibold tracking-tight mb-4 text-black"></h2>
            <div class="relative">
              <select id="select-slogan" class="w-full appearance-none bg-[#F2F2F7] border-0 text-black font-medium text-[16px] py-3.5 px-4 pr-10 rounded-xl focus:ring-2 focus:ring-[#007AFF] focus:outline-none cursor-pointer hover:bg-[#E5E5EA] transition-colors">
                <!-- Options injectées via JS -->
              </select>
              <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#8E8E93]">
                <i data-lucide="chevron-down" class="w-5 h-5"></i>
              </div>
            </div>
          </div>

          <div class="relative w-full max-w-[320px] mx-auto rounded-[20px] overflow-hidden border border-black/5 bg-[#F2F2F7]">
            <canvas id="canvas2" class="w-full h-auto"></canvas>
          </div>

          <div>
            <button id="btn-dl-2" class="w-full flex items-center justify-center py-3.5 px-4 bg-[#007AFF] text-white rounded-xl font-semibold text-[17px] shadow-sm hover:bg-[#006ee6] active:scale-[0.98] transition-all">
              <i data-lucide="download" class="w-5 h-5 mr-2"></i>
              <span id="txt-dl-2"></span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer Back Link (Glassmorphism minimal) -->
  <a href="#" id="link-back" class="fixed bottom-6 left-6 md:bottom-10 md:left-10 z-10 ios-glass text-[#1D1D1F] px-5 py-3 text-[15px] font-medium rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:scale-105 active:scale-[0.98] transition-all flex items-center">
    <i data-lucide="arrow-left" class="w-4 h-4 mr-2 text-[#8E8E93]"></i>
    <span id="txt-back"></span>
  </a>

  <!-- Error Modal (Minimal) -->
  <div id="modal-error" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-md transition-opacity">
    <div class="bg-white/90 backdrop-blur-xl rounded-[24px] shadow-2xl p-6 w-full max-w-sm border border-white/20 text-center relative">
      <button id="btn-close-modal-x" class="absolute top-4 right-4 text-[#8E8E93] hover:text-black transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="flex justify-center items-center mb-2 text-[#FF3B30]">
        <i data-lucide="alert-circle" class="w-10 h-10"></i>
      </div>
      <h3 id="modal-title" class="text-xl font-semibold text-black mb-1">Erreur</h3>
      <p id="modal-msg" class="text-[15px] text-[#3C3C43] mb-6"></p>
      <button id="btn-close-modal" class="w-full bg-[#007AFF] text-white font-semibold text-[17px] py-3 px-4 rounded-xl hover:bg-[#006ee6] active:scale-[0.98] transition-all">
        Fermer
      </button>
    </div>
  </div>

  <!-- MAIN SCRIPT -->
  <script>
    // --- CONSTANTES ---
    const CANVAS_WIDTH = 1080;
    const POST_HEIGHT = 1440;
    const STORY_HEIGHT = 1920;

    const COLORS = ['#15BE09', '#196FF0', '#EBC40F', '#F36317', '#FFC3F2'];

    const ASSETS = {
      logos: {
        en: 'https://i.imgur.com/sOk0F7b.png',
        fr: 'https://i.imgur.com/Yyph9SG.png',
      },
      art: {
        fr: 'https://i.imgur.com/lazBJMI.png',
        en: 'https://i.imgur.com/JpBWko5.png',
      },
      slogans: {
        fr: {
          unites: 'https://i.imgur.com/j78uajx.png',
          shapes: 'https://i.imgur.com/wjIfx5q.png',
          empowers: 'https://i.imgur.com/tyvmOA8.png',
          lifts: 'https://i.imgur.com/eNPYcwi.png',
          moves: 'https://i.imgur.com/W96dz2k.png',
        },
        en: {
          unites: 'https://i.imgur.com/WjwIcCs.png',
          shapes: 'https://i.imgur.com/tTZCG5x.png',
          empowers: 'https://i.imgur.com/8n1kwqA.png',
          lifts: 'https://i.imgur.com/utMcVZW.png',
          moves: 'https://i.imgur.com/EaaBuOH.png',
        }
      }
    };

    const TRANSLATIONS = {
      fr: {
        titleMain: 'Boîte à outils pour les médias sociaux',
        descMain: `La boîte à outil pour les médias sociaux du Conseil des arts du Canada vous permet de créer deux images personnalisées en choisissant une couleur de thème, en téléversant votre propre photo et en sélectionnant le slogan qui vous interpelle le plus. C'est un moyen simple de partager vos réalisations artistiques, tout en participant à un mouvement visant à démontrer à quel point l’art nous unit, partout au Canada.`,
        descSubHTML: `<span class="font-bold text-gray-900">Créez, téléchargez et partagez!</span><br> Mentionnez le Conseil des arts dans votre publication et ajoutez <span class="italic">#LArtNousUnit</span> pour partager votre histoire.`,
        labelFormat: '1. Sélectionnez votre format.',
        labelColor: '2. Choisissez une couleur.',
        formatPost: 'Publication (1080x1440)',
        formatStory: 'Story (1080x1920)',
        titleImg1: '3. Première Image',
        labelFileInput: 'Téléversez une image...',
        downloadBtn1: "Télécharger l'Image 1",
        titleImg2: '4. Deuxième Image',
        downloadBtn2: "Télécharger l'Image 2",
        slogans: {
          unites: 'Nous unit.',
          shapes: 'Nous façonne.',
          empowers: 'Nous renforce.',
          lifts: 'Nous inspire.',
          moves: 'Nous enrichit.',
        },
        errorTitle: 'Erreur',
        closeBtn: 'Fermer',
        loading: 'Chargement...',
        errorFileType: "Le fichier n'est pas une image.",
        errorFileCorrupt: "Impossible de charger l'image.",
        errorDownloadMissing: "Image d'arrière-plan manquante.",
        backBtn: 'Retour à la page de la campagne'
      },
      en: {
        titleMain: 'Social Media Toolkit',
        descMain: `The Canada Council for the Arts’ Social Media Toolkit allows you to create two personalized images by choosing a theme color, uploading your own photo and selecting the slogan that resonates with you the most. It’s a simple way to share your artistic achievements while joining a movement that shows how art unites us coast to coast to coast.`,
        descSubHTML: `<span class="font-bold text-gray-900">Create, download and share!</span><br> Tag the Canada Council in your post and use <span class="italic">#ArtUnitesUs</span> to share your story.`,
        labelFormat: '1. Select your format.',
        labelColor: '2. Choose a colour.',
        formatPost: 'Post (1080x1440)',
        formatStory: 'Story (1080x1920)',
        titleImg1: '3. Create your first image',
        labelFileInput: 'Upload an image...',
        downloadBtn1: 'Download Image 1',
        titleImg2: '4. Create your second image',
        downloadBtn2: 'Download Image 2',
        slogans: {
          unites: 'Unites us.',
          shapes: 'Shapes us.',
          empowers: 'Empowers us.',
          lifts: 'Propels us.',
          moves: 'Moves us.',
        },
        errorTitle: 'Error',
        closeBtn: 'Close',
        loading: 'Loading...',
        errorFileType: 'The file is not an image.',
        errorFileCorrupt: 'Cannot load the image.',
        errorDownloadMissing: 'Background image missing.',
        backBtn: 'Back to the campaign landing page'
      }
    };

    // --- STATE ---
    const state = {
      lang: 'fr',
      format: 'post', // 'post' | 'story'
      color: COLORS[0],
      sloganKey: 'unites',
      bgImage: null, // Image object
      panOffset: { x: 0, y: 0 }
    };

    // Images Loaded Refs
    const loadedAssets = {
      logo: new Image(),
      art: new Image(),
      slogan: new Image()
    };
    loadedAssets.logo.crossOrigin = 'anonymous';
    loadedAssets.art.crossOrigin = 'anonymous';
    loadedAssets.slogan.crossOrigin = 'anonymous';

    // Dragging state
    let isDragging = false;
    let lastPos = { x: 0, y: 0 };

    // --- INITIALIZATION ---
    function init() {
      detectLanguage();
      setupEventListeners();
      setupColorButtons();
      lucide.createIcons();
      updateFormatUI();
      updateLanguage(); // Triggers render
    }

    // --- LOGIC ---

    function detectLanguage() {
      // 1. URL Param
      const params = new URLSearchParams(window.location.search);
      const urlLang = params.get('lang');
      if (urlLang === 'en' || urlLang === 'fr') {
        state.lang = urlLang;
        return;
      }
      // 2. Navigator
      const browserLang = navigator.language || navigator.userLanguage;
      if (browserLang && browserLang.toLowerCase().startsWith('en')) {
        state.lang = 'en';
      } else {
        state.lang = 'fr';
      }
    }

    function updateURL() {
      const url = new URL(window.location);
      url.searchParams.set('lang', state.lang);
      window.history.pushState({}, '', url);
    }

    function loadAsset(imgObj, src) {
      return new Promise((resolve) => {
        imgObj.src = src;
        imgObj.onload = () => resolve(true);
        imgObj.onerror = () => resolve(false);
      });
    }

    async function updateAssets() {
      await Promise.all([
        loadAsset(loadedAssets.logo, ASSETS.logos[state.lang]),
        loadAsset(loadedAssets.art, ASSETS.art[state.lang]),
        loadAsset(loadedAssets.slogan, ASSETS.slogans[state.lang][state.sloganKey])
      ]);
      drawCanvas1();
      drawCanvas2();
    }

    // --- DOM UPDATES ---

    function setupColorButtons() {
      const container = document.getElementById('color-container');
      container.innerHTML = '';
      COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `w-8 h-8 rounded-full transition-all focus:outline-none border border-black/10 hover:scale-105`;
        btn.style.backgroundColor = c;
        btn.onclick = () => {
          state.color = c;
          updateColorSelection();
          drawCanvas1();
          drawCanvas2();
        };
        btn.dataset.color = c;
        container.appendChild(btn);
      });
      updateColorSelection();
    }

    function updateColorSelection() {
      const btns = document.getElementById('color-container').children;
      for (let btn of btns) {
        if (btn.dataset.color === state.color) {
          btn.classList.add('color-selected');
        } else {
          btn.classList.remove('color-selected');
        }
      }
    }

    function updateLanguage() {
      const t = TRANSLATIONS[state.lang];
      document.documentElement.lang = state.lang;
      
      // Update Texts
      document.getElementById('txt-title-main').textContent = t.titleMain;
      document.getElementById('txt-desc-main').textContent = t.descMain;
      document.getElementById('txt-desc-sub').innerHTML = t.descSubHTML;
      document.getElementById('lbl-format').textContent = t.labelFormat;
      document.getElementById('lbl-color').textContent = t.labelColor;
      document.getElementById('txt-format-post').textContent = t.formatPost;
      document.getElementById('txt-format-story').textContent = t.formatStory;
      document.getElementById('title-img1').textContent = t.titleImg1;
      document.getElementById('lbl-file-input').textContent = t.labelFileInput;
      document.getElementById('txt-dl-1').textContent = t.downloadBtn1;
      document.getElementById('title-img2').textContent = t.titleImg2;
      document.getElementById('txt-dl-2').textContent = t.downloadBtn2;
      document.getElementById('txt-back').textContent = t.backBtn;
      document.getElementById('modal-title').textContent = t.errorTitle;
      document.getElementById('btn-close-modal').textContent = t.closeBtn;

      // Header Logo
      document.getElementById('header-logo').src = ASSETS.logos[state.lang];

      // Lang Buttons Style (HIG Segmented Control)
      const btnEn = document.getElementById('btn-lang-en');
      const btnFr = document.getElementById('btn-lang-fr');
      const activeLang = ["bg-white", "shadow-sm", "text-black", "font-semibold"];
      const inactiveLang = ["text-[#8E8E93]", "hover:text-black", "font-medium"];
      
      if (state.lang === 'en') {
        btnEn.classList.add(...activeLang); btnEn.classList.remove(...inactiveLang);
        btnFr.classList.add(...inactiveLang); btnFr.classList.remove(...activeLang);
      } else {
        btnFr.classList.add(...activeLang); btnFr.classList.remove(...inactiveLang);
        btnEn.classList.add(...inactiveLang); btnEn.classList.remove(...activeLang);
      }

      // Slogan Select Options
      const select = document.getElementById('select-slogan');
      select.innerHTML = '';
      Object.entries(t.slogans).forEach(([key, text]) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = text;
        if(key === state.sloganKey) opt.selected = true;
        select.appendChild(opt);
      });

      updateURL();
      updateAssets(); // Reload assets and redraw
    }

    function updateFormatUI() {
      const btnPost = document.getElementById('btn-format-post');
      const btnStory = document.getElementById('btn-format-story');

      const activeFmt = ["bg-white", "shadow-sm", "text-black", "font-semibold"];
      const inactiveFmt = ["text-[#8E8E93]", "hover:text-black", "font-medium"];

      if (state.format === 'post') {
        btnPost.classList.add(...activeFmt); btnPost.classList.remove(...inactiveFmt);
        btnStory.classList.add(...inactiveFmt); btnStory.classList.remove(...activeFmt);
      } else {
        btnStory.classList.add(...activeFmt); btnStory.classList.remove(...inactiveFmt);
        btnPost.classList.add(...inactiveFmt); btnPost.classList.remove(...activeFmt);
      }
      
      const height = state.format === 'post' ? POST_HEIGHT : STORY_HEIGHT;
      const ratio = `${CANVAS_WIDTH} / ${height}`;
      
      const c1 = document.getElementById('canvas1');
      const c2 = document.getElementById('canvas2');
      c1.width = CANVAS_WIDTH; c1.height = height; c1.style.aspectRatio = ratio;
      c2.width = CANVAS_WIDTH; c2.height = height; c2.style.aspectRatio = ratio;

      drawCanvas1();
      drawCanvas2();
    }

    // --- CANVAS LOGIC ---

    function drawCanvas1() {
      const canvas = document.getElementById('canvas1');
      const ctx = canvas.getContext('2d');
      const currentHeight = state.format === 'post' ? POST_HEIGHT : STORY_HEIGHT;
      const t = TRANSLATIONS[state.lang];

      // Clear & BG
      ctx.clearRect(0, 0, CANVAS_WIDTH, currentHeight);
      ctx.fillStyle = '#f3f3f3';
      ctx.fillRect(0, 0, CANVAS_WIDTH, currentHeight);

      // User Image
      if (state.bgImage) {
        const img = state.bgImage;
        const imgRatio = img.width / img.height;
        const canvasRatio = CANVAS_WIDTH / currentHeight;
        let sWidth, sHeight, sx, sy;

        if (imgRatio > canvasRatio) {
          sHeight = img.height;
          sWidth = img.height * canvasRatio;
          sx = (img.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = img.width;
          sHeight = img.width / canvasRatio;
          sx = 0;
          sy = (img.height - sHeight) / 2;
        }

        ctx.drawImage(
          img, 
          sx + state.panOffset.x, sy + state.panOffset.y,
          sWidth, sHeight,
          0, 0,
          CANVAS_WIDTH, currentHeight
        );
        
        // Update button state
        const btnDl = document.getElementById('btn-dl-1');
        btnDl.disabled = false;
        btnDl.classList.remove('bg-[#F2F2F7]', 'text-[#C7C7CC]', 'cursor-not-allowed');
        btnDl.classList.add('bg-[#007AFF]', 'text-white', 'shadow-sm', 'hover:bg-[#006ee6]', 'active:scale-[0.98]');

      } else {
        // Disable button
        const btnDl = document.getElementById('btn-dl-1');
        btnDl.disabled = true;
        btnDl.classList.add('bg-[#F2F2F7]', 'text-[#C7C7CC]', 'cursor-not-allowed');
        btnDl.classList.remove('bg-[#007AFF]', 'text-white', 'shadow-sm', 'hover:bg-[#006ee6]', 'active:scale-[0.98]');
      }

      // Art Block
      const artBlockY = state.format === 'story' ? 828 : 618;
      const artWidth = state.lang === 'fr' ? 455 : 374;
      const artHeight = 211;

      ctx.fillStyle = state.color;
      ctx.fillRect(0, artBlockY, artWidth, artHeight);

      if (loadedAssets.art.complete && loadedAssets.art.naturalWidth) {
        ctx.drawImage(loadedAssets.art, 0, artBlockY, artWidth, artHeight);
      }
    }

    function drawCanvas2() {
      const canvas = document.getElementById('canvas2');
      const ctx = canvas.getContext('2d');
      const currentHeight = state.format === 'post' ? POST_HEIGHT : STORY_HEIGHT;

      // BG Color
      ctx.fillStyle = state.color;
      ctx.fillRect(0, 0, CANVAS_WIDTH, currentHeight);

      // Slogan
      const sloganY = state.format === 'story' ? 842 : 632;
      if (loadedAssets.slogan.complete && loadedAssets.slogan.naturalWidth) {
        ctx.drawImage(loadedAssets.slogan, 0, sloganY);
      }

      // Logo
      if (loadedAssets.logo.complete && loadedAssets.logo.naturalWidth) {
        ctx.drawImage(loadedAssets.logo, 40, 40);
      }
    }

    // --- EVENTS ---

    function setupEventListeners() {
      // Lang
      document.getElementById('btn-lang-en').onclick = () => { state.lang = 'en'; updateLanguage(); };
      document.getElementById('btn-lang-fr').onclick = () => { state.lang = 'fr'; updateLanguage(); };

      // Format
      document.getElementById('btn-format-post').onclick = () => { state.format = 'post'; updateFormatUI(); };
      document.getElementById('btn-format-story').onclick = () => { state.format = 'story'; updateFormatUI(); };

      // File Input
      document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showError(TRANSLATIONS[state.lang].errorFileType);
          return;
        }
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            state.bgImage = img;
            state.panOffset = { x: 0, y: 0 };
            drawCanvas1();
          };
          img.onerror = () => showError(TRANSLATIONS[state.lang].errorFileCorrupt);
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      };

      // Slogan Select
      document.getElementById('select-slogan').onchange = (e) => {
        state.sloganKey = e.target.value;
        updateAssets();
      };

      // Downloads
      document.getElementById('btn-dl-1').onclick = () => downloadCanvas('canvas1', 'custom');
      document.getElementById('btn-dl-2').onclick = () => downloadCanvas('canvas2', `slogan-${state.sloganKey}`);

      // Modal
      document.getElementById('btn-close-modal').onclick = hideError;
      document.getElementById('btn-close-modal-x').onclick = hideError;

      // Pan/Drag
      const c1 = document.getElementById('canvas1');
      c1.addEventListener('mousedown', startPan);
      c1.addEventListener('mousemove', movePan);
      window.addEventListener('mouseup', endPan);
      c1.addEventListener('touchstart', startPan, {passive: false});
      c1.addEventListener('touchmove', movePan, {passive: false});
      window.addEventListener('touchend', endPan);
    }

    // Pan Logic
    function getPos(e, canvas) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function startPan(e) {
      if (!state.bgImage) return;
      isDragging = true;
      lastPos = getPos(e, document.getElementById('canvas1'));
    }

    function movePan(e) {
      if (!isDragging || !state.bgImage) return;
      if (e.type === 'touchmove') e.preventDefault(); // Stop scroll
      
      const newPos = getPos(e, document.getElementById('canvas1'));
      const dx = newPos.x - lastPos.x;
      const dy = newPos.y - lastPos.y;
      const sensitivity = 2.5;

      state.panOffset.x -= dx * sensitivity;
      state.panOffset.y -= dy * sensitivity;
      
      lastPos = newPos;
      drawCanvas1();
    }

    function endPan() {
      isDragging = false;
    }

    function downloadCanvas(id, suffix) {
      const canvas = document.getElementById(id);
      try {
        if (id === 'canvas1' && !state.bgImage) {
          showError(TRANSLATIONS[state.lang].errorDownloadMissing);
          return;
        }
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        const link = document.createElement('a');
        link.download = `CCA-CAC-${suffix}-${state.format}.jpg`;
        link.href = dataUrl;
        link.click();
      } catch (err) {
        showError("Erreur CORS: Impossible de télécharger l'image.");
      }
    }

    function showError(msg) {
      document.getElementById('modal-msg').textContent = msg;
      document.getElementById('modal-error').classList.remove('hidden');
    }
    
    function hideError() {
      document.getElementById('modal-error').classList.add('hidden');
    }

    // Start
    document.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
