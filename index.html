<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Principal — Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 100px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
    }

    .label {
      font-size: 18px;
    }

    main {
      max-width: 1400px;
    }

    .experiment {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;

      padding: 18px 0;
      border-top: 1px solid #111;

      text-decoration: none;
      color: inherit;

      transition: opacity 0.15s ease;
    }

    .experiment:last-child {
      border-bottom: 1px solid #111;
    }

    .experiment:hover {
      opacity: 0.45;
    }

    .number {
      font-size: 14px;
    }

    .title {
      font-size: clamp(24px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .arrow {
      font-size: 24px;
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 32px;
      right: 32px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
    }

    @media (max-width: 700px) {

      body {
        padding: 20px;
      }

      header {
        margin-bottom: 60px;
      }

      .experiment {
        grid-template-columns: 45px 1fr auto;
      }

      footer {
        left: 20px;
        right: 20px;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    PRINCIPAL
  </div>

  <div class="label">
    LAB
  </div>

</header>


<main>

  <a class="experiment" href="image-processor.html">
    <div class="number">001</div>
    <div class="title">Image Processor</div>
    <div class="arrow">↗</div>
  </a>


  <a class="experiment" href="halftone.html">
    <div class="number">002</div>
    <div class="title">Halftone Generator</div>
    <div class="arrow">↗</div>
  </a>


  <a class="experiment" href="dissolve.html">
    <div class="number">003</div>
    <div class="title">Dissolve</div>
    <div class="arrow">↗</div>
  </a>


</main>


<footer>

  <div>
    Tools & Experiments
  </div>

  <div>
    Principal © 2026
  </div>

</footer>

</body>
</html>
