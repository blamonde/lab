<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principal — Lab</title>

  <style>
    :root {
      --po-bg: #f7f7f5;
      --po-surface: #ffffff;
      --po-surface-hover: #efefec;
      --po-text: #111111;
      --po-secondary: #74746f;
      --po-tertiary: #a3a39d;
      --po-border: #e4e4df;
      --po-border-strong: #cecec8;
      --po-radius-sm: 7px;
      --po-radius-md: 12px;
      --po-radius-lg: 18px;
      --po-font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --po-ease: cubic-bezier(.2,0,0,1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--po-bg);
      color: var(--po-text);
      font-family: var(--po-font);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(calc(100% - 48px), 1440px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--po-border);
      font-size: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 550;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--po-text);
    }

    .lab-label {
      color: var(--po-secondary);
    }

    main {
      flex: 1;
      padding: 88px 0 96px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 380px);
      gap: 48px;
      align-items: end;
      margin-bottom: 80px;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(42px, 6.2vw, 88px);
      line-height: .94;
      font-weight: 480;
      letter-spacing: -0.055em;
    }

    .intro p {
      margin: 0 0 5px;
      color: var(--po-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .tools-label {
      margin-bottom: 14px;
      color: var(--po-tertiary);
      font-size: 11px;
      font-weight: 550;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .tools {
      overflow: hidden;
      border: 1px solid var(--po-border);
      border-radius: var(--po-radius-lg);
      background: var(--po-surface);
    }

    .tool {
      position: relative;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      min-height: 92px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--po-border);
      transition:
        background 180ms var(--po-ease),
        padding 180ms var(--po-ease);
    }

    .tool:last-child { border-bottom: 0; }

    .tool:hover {
      background: var(--po-surface-hover);
      padding-left: 26px;
    }

    .number {
      color: var(--po-tertiary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .title {
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.1;
      font-weight: 450;
      letter-spacing: -0.03em;
    }

    .open {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--po-bg);
      color: var(--po-secondary);
      font-size: 17px;
      transition:
        transform 180ms var(--po-ease),
        background 180ms var(--po-ease),
        color 180ms var(--po-ease);
    }

    .tool:hover .open {
      transform: translate(2px, -2px);
      background: var(--po-text);
      color: white;
    }

    footer {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--po-border);
      color: var(--po-tertiary);
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .shell { width: min(calc(100% - 32px), 1440px); }
      header { height: 64px; }

      main { padding: 56px 0 72px; }

      .intro {
        grid-template-columns: 1fr;
        gap: 24px;
        margin-bottom: 52px;
      }

      h1 {
        font-size: clamp(44px, 14vw, 68px);
      }

      .intro p { max-width: 420px; }

      .tool {
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: 10px;
        min-height: 78px;
        padding: 16px;
      }

      .tool:hover { padding-left: 16px; }
      .title { font-size: 20px; }
      .open { width: 34px; height: 34px; }

      footer {
        padding: 20px 0;
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Principal</span>
      </div>
      <div class="lab-label">Lab</div>
    </header>

    <main>
      <section class="intro">
        <h1>Tools &<br>Experiments</h1>
        <p>
          A collection of small tools, prototypes and image-processing experiments
          developed at Principal.
        </p>
      </section>

      <div class="tools-label">Available tools</div>

      <section class="tools" aria-label="Principal Lab tools">
        <a class="tool" href="duotone-grey-halftone.html">
          <div class="number">01</div>
          <div class="title">Halftone Grey (SDM)</div>
          <div class="open" aria-hidden="true">↗</div>
        </a>

        <a class="tool" href="TrameBuilder-V3.html">
          <div class="number">02</div>
          <div class="title">Halftone Builder</div>
          <div class="open" aria-hidden="true">↗</div>
        </a>

        <a class="tool" href="tritone.html">
          <div class="number">03</div>
          <div class="title">Tritone Image</div>
          <div class="open" aria-hidden="true">↗</div>
        </a>

        <a class="tool" href="cac-tool.html">
          <div class="number">04</div>
          <div class="title">CAC Online Tool</div>
          <div class="open" aria-hidden="true">↗</div>
        </a>
      </section>
    </main>

    <footer>
      <span>Principal Lab</span>
      <span>Principal © 2026</span>
    </footer>
  </div>
</body>
</html>
