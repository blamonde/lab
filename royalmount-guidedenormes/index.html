.brand{display:block!important;width:auto!important;line-height:1.1!important;font-size:20px!important;font-weight:600!important;letter-spacing:-.045em!important;color:#111!important;margin:3px 0 0 10px!important;text-decoration:none!important}.jump a{font-weight:500!important}.family-download{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;margin:0 0 20px;border-radius:3px;background:#111;color:white;text-decoration:none;font-size:12px;font-weight:500}.family-download:hover{background:#333}.jump a{font-weight:700!important}.download-under-visual{padding:17px 0 4px;background:#fff}.download-under-visual .family-download{margin:0;font-weight:600}.asset-library{display:none!important}body.guide-entered .brand-cover{display:none!important}body.guide-entered #guide{scroll-margin-top:0}</style></head><body><aside><a class="brand" href="#accueil" aria-label="Royalmount — accueil">Royalmount</a><nav class="nav"></nav></aside><main><section class="brand-cover" id="accueil" aria-label="Couverture du guide"><div class="cover-inner"><img src="assets/Logo/RM_RGB_Logo_Noir.png" alt="Royalmount" class="cover-logo"><p class="cover-title">Guide de normes</p></div><a href="#guide" class="cover-next" aria-label="Accéder au guide">Explorer le guide <span aria-hidden="true">↓</span></a></section><div id="guide" class="top"><input id="search" type="search" placeholder="Rechercher une règle…" aria-label="Rechercher"></div><div class="content"><div class="intro"><div><h1>Logo</h1></div></div><div class="jump"></div><div class="palette"></div><div class="asset-library" id="asset-library" hidden></div><div class="entries"></div></div></main><div class="toast" id="toast" role="status"></div><script>const DATA=[{"page": 5, "section": "Logo", "title": "1.1 LOGO", "paragraphs": ["Le logo est notre identifiant principal. C’est l’élément le plus fréquemment utilisé pour représenter notre marque, notamment auprès d’un public qui n’est pas familier avec Royalmount.", "Basé sur la police Styrène A Medium que nous utilisons pour les titrages, notre logo a été personnalisé pour conserver le style Art déco distinctif de notre logo d’origine. L’interlettrage a été soigneusement ajusté pour optimiser la lisibilité à toutes les échelles. Ne modifiez pas sa construction et ne tentez pas de le recréer."], "image": "visuals/05.jpg"}, {"page": 6, "section": "Logo", "title": "1.2 COULEUR", "paragraphs": ["Assurez-vous qu’il y ait suffisamment de contraste entre le logo et l’arrière-plan.", "Pour les applications corporatives, utilisez le logo noir ou le logo blanc.", "Lorsqu’un partenaire externe vous demande votre logo, remettez-lui le logo noir et le logo blanc.", "Pour les communications, l’éventail complet de la palette élargie est à votre disposition. Laissez- vous guider par les agencements ci-contre."], "image": "visuals/06.jpg"}, {"page": 7, "section": "Logo", "title": "1.3 MARGE DE SÉCURITÉ", "paragraphs": ["Lorsque vous placez d’autres éléments à proximité, veillez à ne pas encombrer le logo. Aucun texte, logo ou photo ne devrait le chevaucher.", "Utilisez le « O » du logo comme mesure d’espacement minimale.", "Exceptionnellement, lors de l’utilisation du logo en très grand format, la marge de sécurité peut être réduite considérablement."], "image": "visuals/07.jpg"}, {"page": 8, "section": "Logo", "title": "1.4 TAILLE DU LOGO", "paragraphs": ["Optimisé pour conserver ses qualités esthétiques et sa lisibilité à plusieurs tailles, le logo peut être utilisé à grande et à petite échelle.", "Lorsque vous choisissez la taille du logo, tenez toujours compte du contexte, des objectifs de communication et du ton désiré.", "Lorsqu’utilisé en gros, le logo apporte un ton plus audacieux et publicitaire, tandis qu’en petit, il est plus distingué et réservé.", "N’utilisez pas le logo à une taille inférieure à 0.2 pouce (15 px) de haut."], "image": "visuals/08.jpg"}, {"page": 9, "section": "Logo", "title": "1.5 POSITIONNEMENT", "paragraphs": ["Dans les pièces de communication de Royalmount, le logo doit être centré horizontalement et positionné à l’un de ces trois emplacements. Il doit toujours être contenu et aligné dans la grille du document."], "image": "visuals/09.jpg"}, {"page": 10, "section": "Logo", "title": "1.6 POSITIONNEMENT EXEMPLES", "paragraphs": [], "image": "visuals/10.jpg"}, {"page": 11, "section": "Logo", "title": "1.7 RESTRICTIONS", "paragraphs": ["Évitez les traitements suivants."], "image": "visuals/11.jpg"}, {"page": 12, "section": "Logo", "title": "1.8 EXEMPLE PAPETERIE", "paragraphs": [], "image": "visuals/12.jpg"}, {"page": 13, "section": "Logo", "title": "1.9 EXEMPLE SAC", "paragraphs": [], "image": "visuals/13.jpg"}, {"page": 15, "section": "Monogramme", "title": "2.1 MONOGRAMME", "paragraphs": ["Le monogramme est la plus petite représentation de la marque. Il doit être utilisé pour les applications compactes qui obligent une reproduction en très petit format, comme l’avatar des médias sociaux, un favicon ou une icône d’application.", "Il peut aussi être utilisé pour remplacer le logo à des endroits où le public est familier avec la marque, ainsi que pour la conception de produits dérivés.", "Il ne devrait jamais apparaître avec le logo dans la même composition."], "image": "visuals/15.jpg"}, {"page": 16, "section": "Monogramme", "title": "2.2 COULEUR", "paragraphs": ["Assurez-vous qu’il y ait suffisamment de contraste entre le monogramme et l’arrière-plan.", "Pour les applications corporatives, utilisez les couleurs de la palette de base. Pour les communications, l’éventail complet de la palette élargie est à votre disposition.", "Laissez-vous guider par les agencements ci-contre."], "image": "visuals/16.jpg"}, {"page": 17, "section": "Monogramme", "title": "2.3 MARGE DE SÉCURITÉ", "paragraphs": ["Lorsque vous placez d’autres éléments à proximité, veillez à ne pas encombrer le monogramme. Aucun texte, logo ou photo ne devrait le chevaucher.", "Utilisez la moitié de la largeur du monogramme comme mesure d’espacement minimale."], "image": "visuals/17.jpg"}, {"page": 18, "section": "Monogramme", "title": "2.4 TAILLE DU MONOGRAMME", "paragraphs": ["Le monogramme est destiné à être utilisé en petit format, spécifiquement pour remplacer le logo aux endroits ou l’espace est restrain, ou lorsque l’utilisateur est déjà très familier avec la marque.", "N’utilisez pas le monogramme à une taille supérieure à 1 pouce (72 px) de haut.", "N’utilisez pas le monogramme à une taille inférieure à 0.3 pouce (22px) de haut."], "image": "visuals/18.jpg"}, {"page": 19, "section": "Monogramme", "title": "2.5 RESTRICTIONS", "paragraphs": ["Évitez les traitements suivants."], "image": "visuals/19.jpg"}, {"page": 20, "section": "Monogramme", "title": "2.6 EXEMPLE AVATAR POUR MÉDIAS SOCIAUX", "paragraphs": [], "image": "visuals/20.jpg"}, {"page": 21, "section": "Monogramme", "title": "2.7 EXEMPLE ICÔNE D’APPLICATION", "paragraphs": [], "image": "visuals/21.jpg"}, {"page": 22, "section": "Monogramme", "title": "2.8 EXEMPLE PRODUIT DÉRIVÉ", "paragraphs": [], "image": "visuals/22.jpg"}, {"page": 23, "section": "Monogramme", "title": "2.9 EXEMPLE CARTE-CADEAU", "paragraphs": [], "image": "visuals/23.jpg"}, {"page": 24, "section": "Monogramme", "title": "2.10 EXEMPLE STEP AND REPEAT", "paragraphs": [], "image": "visuals/24.jpg"}, {"page": 26, "section": "Couleur", "title": "3.1 PALETTE DE BASE", "paragraphs": ["Les couleurs de la palette de base sont utilisées principalement pour les pièces de communication corporative, comme la papeterie, l’avatar des médias sociaux, les documents de traitement de texte et de présentation, etc.", "En cas de doute, utilisez de la typographie noir et gris souris sur un fond blanc."], "image": "visuals/26.jpg"}, {"page": 27, "section": "Couleur", "title": "3.2 PALETTE ÉLARGIE", "paragraphs": ["Éclatantes, matures ou délicates, les nuances de la palette élargie couvrent tous les autres besoins de communication de la marque."], "image": "visuals/27.jpg"}, {"page": 28, "section": "Couleur", "title": "3.3 DUOS DE COULEURS", "paragraphs": ["La combinaison de couleurs est au cœur de notre identité visuelle. Lors de la sélection des duos, il est important de prendre en compte leur relation. Tenez toujours compte du cas d’utilisation et de l’effet sur la lisibilité. Laissez-vous guider par les duos présents sur cette page."], "image": "visuals/28.jpg"}, {"page": 29, "section": "Couleur", "title": "3.4 TRIO DE COULEURS", "paragraphs": ["Il est aussi possible de combiner 3 couleurs à la fois, principalement lors de l’utilisation des silhouettes. Inspirez vous de ces trios particulièrement harmonieux."], "image": "visuals/29.jpg"}, {"page": 30, "section": "Couleur", "title": "3.5 RESTRICTIONS ET ACCESSIBILITÉ", "paragraphs": ["Évitez les combinaisons de couleurs marquées d’un trait oblique.", "Les combinaisons entièrement conformes aux normes AA pour une utilisation numérique sont marquées de 2 astérisques. (**)", "Ceux qui sont marqués d’un seul astérisque (*) sont aussi conformes aux normes AA, mais le texte doit faire au moins 18 pt."], "image": "visuals/30.jpg"}, {"page": 32, "section": "Typographie", "title": "4.1 POLICE DE TITRAGE", "paragraphs": ["Styrène A est une police sans empattement dessinée par Berton Hasebe. Elle est flexible et utilitaire, avec plusieurs détails distinctifs, une construction géométrique, et des proportions assez larges.", "Basé sur le dessin de Styrène A Medium, le logo s’agence parfaitement à la police de titrage.", "Pour obtenir une copie de la police ou si vous avez des questions concernant les licences, veuillez contacter l’équipe des communications de Royalmount.", "Le style le plus couramment utilisé pour les titres est le Medium. Le style Regular peut aussi être utile pour ajouter de la hiérarchie dans un titre.", "Lorsque Styrene A n’est pas disponible, comme dans certains logiciels de traitement de texte ou de messagerie, la police Instrument Sans devrait être utilisée comme police de remplacement.", "En dernier recours, lorsqu’Instrument Sans n’est pas disponible, Arial pourra prendre le relais."], "image": "visuals/32.jpg"}, {"page": 33, "section": "Typographie", "title": "4.2 POLICE DE TEXTE COURANT", "paragraphs": ["Instrument Sans est une police sans empattement dessinée par Rodrigo Fuenzalida et Jordan Egstad. Fiable et polyvalente, elle est parfaite pour formatter le texte courant.", "Pour télécharger la police gratuitement, rendez-vous à l’adresse suivante : fonts.google.com/specimen/Instrument+Sans", "Le style le plus couramment utilisé pour le texte courant est le Regular. Le style SemiBold peut être utile pour mettre un élément en évidence.", "Lorsqu’Instrument Sans n’est pas disponible, Arial pourra prendre le relais."], "image": "visuals/33.jpg"}, {"page": 34, "section": "Typographie", "title": "4.3 ALIGNEMENT DES PARAGRAPHES", "paragraphs": ["La typographie ne doit être alignée que de façon centrée où à gauche.", "N’alignez jamais à droite et ne justifiez jamais la typographie."], "image": "visuals/34.jpg"}, {"page": 35, "section": "Typographie", "title": "4.4 INTERLIGNAGE", "paragraphs": ["Plus le texte est gros et plus l’interlignage doit être serré. Voici quelques mesures pratiques :", "GROS TITRES - plus de 30 pt Interlignage = Taille du texte PETITS TITRES - sous 30 pt Interlignage = Taille du texte x 1.15", "GROS TEXTE COURANT - entre 16 et 50 pt Interlignage = Taille du texte x 1.15", "PETIT TEXTE COURANT - sous 16 pt Interlignage = Taille du texte x 1.25"], "image": "visuals/35.jpg"}, {"page": 36, "section": "Typographie", "title": "4.5 INTERLETTRAGE", "paragraphs": ["Plus le texte est gros et plus l’interlettrage doit être serré. À l’inverse, un paragraphe de texte plus petit bénéficie d’un interletterage plus généreux, aidant à la lisibilité. Voici quelques mesures pratiques :", "GROS TITRES - plus de 30 pt Interlettrage = -20 PETITS TITRES - sous 30 pt Interlettrage = 0", "GROS TEXTE COURANT - entre 16 et 50 pt Interlettrage = 0", "PETIT TEXTE COURANT - sous 16 pt Interlettrage = 10"], "image": "visuals/36.jpg"}, {"page": 37, "section": "Typographie", "title": "4.6 LONGUEUR DES LIGNES", "paragraphs": ["La longueur des lignes joue un rôle important dans la lisibilité des textes courants. Évitez les lignes trop longues ou trop courtes.", "Pour les textes courants, visez une longueur optimale de 45 à 75 caractères.", "Pour les titres et les courts textes, des lignes plus courtes sont préférables."], "image": "visuals/37.jpg"}, {"page": 38, "section": "Typographie", "title": "4.7 CAPITALISATION", "paragraphs": ["La plupart des titres devraient être formatés en capitales, créant des blocs réguliers et francs.", "Pour certains titres plus longs, il est préférable d’utiliser la casse de la phrase (première lettre en majuscule et le reste en minuscule) pour assurer une lecture agréable.", "Laissez-vous guider par ces normes:", "TITRES DE PREMIER NIVEAU Tout en capitale", "TITRES SECONDAIRES, comme le titre d’un articles de blogue ou l’intertitre d’un communiqué de presse Casse de la phrase", "SOUS-TITRES DE MOINS DE 10 MOTS Tout en capitale", "SOUS TITRES DE PLUS DE 10 MOTS Casse de la phrase", "BOUTON D’APPEL À L’ACTION DE MOINS DE 25 CARACTÈRES Tout en capitale", "BOUTON D’APPEL À L’ACTION DE 25 CARACTÈRES ET PLUS Casse de la phrase", "TEXTE COURANT Casse de la phrase"], "image": "visuals/38.jpg"}, {"page": 39, "section": "Typographie", "title": "Dans le but de garder les compositions simples, n’utilisez pas plus de 3 tailles typographiques dans une même pièce de communication.", "paragraphs": ["L’utilisation du gris souris est utile pour ajouter un niveau hiérarchique sans changer la taille ou la graisse d’un élément. La capitalisation peut jouer le même rôle.", "Lorsque vous utilisez plus d’une taille typographique, veillez à avoir suffisamment de contraste entre elles.", "Voici quelques exemples de bonne gestion typographique."], "image": "visuals/39.jpg"}, {"page": 40, "section": "Typographie", "title": "4.9 RELATION ENTRE LOGO ET TYPO", "paragraphs": ["Pour maintenir des proportions harmonieuses, suivez ces règles lorsque le logo cohabite avec un bloc typographique dans une même composition :", "OPTION 1 : MÊME TAILLE Le logo et le titre sont de la même taille.", "OPTION 2 : GROS LOGO Le logo est au moins 40% plus gros que le bloc typographique", "OPTION 3 : PETIT LOGO Le logo est au moins 40% plus petit que le bloc typographique", "Nous devrons souvent faire référence à Royalmount dans un titre ou un paragraphe. N’utilisez pas le logo dans ces situations. Traitez simplement le mot «Royalmount» comme le reste du texte."], "image": "visuals/40.jpg"}, {"page": 41, "section": "Typographie", "title": "4.10 TYPOGRAPHIE ET COULEUR", "paragraphs": ["Le contraste des couleurs est crucial pour la lisibilité et l’accessibilité des caractères. Assurez- vous qu’il y ait suffisamment de contraste entre le texte et l’arrière-plan. Référez-vous à la section Couleur pour plus d’information sur les combinaisons de couleurs.", "Dans les applications avec des textes courants qui comptent plus de 30 mots, utilisez les couleurs de la palette de base pour la typographie.", "Les couleurs de la palette élargie sont utiles comme couleurs d’arrière-plan ou pour mettre l’accent sur des informations importantes."], "image": "visuals/41.jpg"}, {"page": 42, "section": "Typographie", "title": "4.11 EXEMPLE INFOLETTRE", "paragraphs": [], "image": "visuals/42.jpg"}, {"page": 43, "section": "Typographie", "title": "4.12 EXEMPLE SIGNALÉTIQUE", "paragraphs": [], "image": "visuals/43.jpg"}, {"page": 44, "section": "Typographie", "title": "4.13 EXEMPLE APPLICATION", "paragraphs": [], "image": "visuals/44.jpg"}, {"page": 46, "section": "Photographie", "title": "5.1 DIRECTION PHOTO", "paragraphs": ["La photographie est un des éléments les plus importants de la marque Royalmount. Le soin et le savoir-faire que nous apportons à notre sélection d’images démontrent notre engagement envers une communication de premier ordre, et une célébration de ce que nous offrons de meilleur.", "Pour assurer la cohérence et la qualité des photographies dans nos communications, nous suivons ces trois principes directeurs :", "OPTIMISTE Royalmount est une marque optimiste et ras- sembleuse qui s’exprime avec joie de vivre dans le but de créer un sentiment d’appartenance. Nos images ne doivent pas être froides ou trop sombres, et si elles sont sélectionnées dans une banque d’images, cela devrait être imperceptible. Quelques éléments clés : • Lumière naturelle • Couleurs chaleureuses et vibrantes • Expressions faciales positives • Poses naturelles et détendues", "AUTHENTIQUE Nous souhaitons que nos images fassent rêver, mais qu’elles reflètent qui nous sommes vraiment. Les photos devraient capturer un moment, raconter une histoire. Quelques éléments clés : • Conservez quelques imperfections • Évitez les images génériques et trop léchées • Casting diversifié (âge, ethnicité, genre)", "DYNAMIQUE Une image dynamique n’est pas prévisible, elle se démarque dans un paysage d’images génériques et similaires. Pour créer du contraste et du rythme dans les compositions, nous utilisons des perspectives et des valeurs de plans variés et inattendus. Quelques éléments clés : • Perspectives variées : de face, à vol d’oiseau, en angle, en contre-plongée, etc. • Valeurs de plan variées : très gros plan, plan moyen, plan large • Juxtaposer une image simple à une image plus complexe"], "image": "visuals/46.jpg"}, {"page": 47, "section": "Photographie", "title": "5.2 SECTEURS ET PROPORTIONS D’UTILISATION", "paragraphs": ["50% MODE, BEAUTÉ ET MAISON Photo lifestyle et photo de produits"], "image": "visuals/47.jpg"}, {"page": 48, "section": "Photographie", "title": "5.3 RESTRICTIONS", "paragraphs": ["Voici quelques types de photos à éviter."], "image": "visuals/48.jpg"}, {"page": 50, "section": "Silhouettes", "title": "6.1 SILHOUETTES", "paragraphs": ["Les silhouettes ont été conçues dans le but de diversifier les contenus visuels et d’offrir plus de flexibilité dans nos communications."], "image": "visuals/50.jpg"}, {"page": 51, "section": "Silhouettes", "title": "6.2 SILHOUETTES VARIATIONS", "paragraphs": ["Schématisations stylisées d’un éventail de produits pouvant se retrouver sur les tables et tablettes de Royalmount, les silhouettes sont agencées dans des compositions bien ordonnées, ou superposées pour créer des motifs à la limite de l’abstraction.", "Dans les compositions superposées, les parties où les illustrations se chevauchent sont retirées afin de révéler la couleur d’arrière-plan.", "Lorsque vous créez une composition, veuillez varier votre sélection de silhouettes parmi les différentes catégories : accessoire, maquillage, chaussures, objets de la maison, vêtement, nourriture, etc.", "Voici 4 façons d’utiliser les silhouettes."], "image": "visuals/51.jpg"}, {"page": 52, "section": "Silhouettes", "title": "6.3 SILHOUETTES CONTENANTS", "paragraphs": ["Certaines silhouettes peuvent aussi être utilisées comme des contenants, pour y placer notre logo, de courts textes, ou des images.", "Ce dispositif graphique est conçu pour être utilisé dans des compositions simples avec peu d’éléments. Il ne convient pas aux mises en page complexes.", "Les 8 contenants suivants peuvent être utilisés à l’horizontale ou à la verticale."], "image": "visuals/52.jpg"}, {"page": 53, "section": "Silhouettes", "title": "6.4 SILHOUETTES COULEUR", "paragraphs": ["Selon l’effet recherché, le contraste entre les silhouettes et le fond peut être subtil ou prononcé.", "Si vous superposez du texte aux silhouettes, assurez-vous qu’il y ait suffisamment de contraste entre le texte, le fond et les silhouettes.", "Voici quelques exemples d’agencements harmonieux.", "Il est possible que les exemples présentés ne respectent pas les normes d’accessibilité Web. Consultez la section Couleur pour plus d’informations."], "image": "visuals/53.jpg"}, {"page": 54, "section": "Silhouettes", "title": "6.5 RESTRICTIONS", "paragraphs": ["Évitez les traitements suivants."], "image": "visuals/54.jpg"}, {"page": 55, "section": "Silhouettes", "title": "6.6 EXEMPLE PRODUIT DÉRIVÉ", "paragraphs": [], "image": "visuals/55.jpg"}, {"page": 56, "section": "Silhouettes", "title": "6.7 EXEMPLE INVITATION VIP", "paragraphs": [], "image": "visuals/56.jpg"}, {"page": 57, "section": "Silhouettes", "title": "6.8 EXEMPLES PUBLICITÉ MAGAZINE", "paragraphs": [], "image": "visuals/57.jpg"}, {"page": 59, "section": "Composition", "title": "7.1 ÉLÉMENTS DE BASE", "paragraphs": ["Les éléments de notre identité visuelle s’assemblent dans des compositions plus ou moins complexes pour répondre à tous nos besoins de communication.", "Tenez compte de la fonction de chaque élément, et assurez-vous que la composition a une intention claire. Attention, l’accent ne devrait pas être mis sur tous les éléments à la fois.", "Établissez une hiérarchie d’informations et intégrez-la dans vos compositions de manière appropriée."], "image": "visuals/59.jpg"}, {"page": 60, "section": "Composition", "title": "7.2 SYSTÈME DE BLOCS", "paragraphs": ["Le système de blocs est une façon modulaire et efficace de créer des compositions simples sans compromettre la lisibilité ou l’impact.", "Sauf pour le logo et des titres de moins de 10 mots, évitez de superposer un bloc de texte sur une photo ou des silhouettes.", "Pour garantir une lisibilité optimale et éviter de surcharger les images, placez les blocs de texte sur un fond uni."], "image": "visuals/60.jpg"}, {"page": 61, "section": "Composition", "title": "7.3 DIPTYQUE", "paragraphs": ["Une des formes les plus simples du système de blocs est le diptyque, cette juxtaposition de 2 photos avec le logo qui s’y superpose.", "Cette composition symbolise la rencontre et permet de raconter une histoire.", "Lors de la sélection d’images, choisissez 2 photos qui contrastent l’une avec l’autre. Quelques exemples :", "Gros plan / Plan large Épurée / Maximaliste Foncée / Pâle Vue de haut / Vue de face Visage / Mains Produit / Expérience"], "image": "visuals/61.jpg"}, {"page": 62, "section": "Composition", "title": "7.4 DIPTYQUE ALIGNEMENT DU LOGO", "paragraphs": ["Lorsque le logo est superposé à une composition en diptyque, plutôt que de le centrer mécaniquement dans la composition, veuillez le bouger légèrement vers la droite pour que le côté gauche de la lettre « M » soit aligné avec la jonction des deux blocs."], "image": "visuals/62.jpg"}, {"page": 63, "section": "Composition", "title": "7.5 GRILLES", "paragraphs": ["Nous utilisons une grille pour organiser les informations de façon précise et ordonnée dans nos compositions.", "Pour les mises en page complexes, comme les documents de présentation ou les dépliants, une grille à 12 colonnes est idéale. Elle permet de répartir les éléments aisément sur 2, 3, 4 ou 6 colonnes.", "Pour les petits documents, comme une publication pour les médias sociaux, un carton d’invitation ou un communiqué de presse, une grille plus simple, comptant 6 ou 4 colonnes, est préférable.", "Observez la manière dont les blocs de texte sont ancrés dans le haut, le centre et le bas des compositions.", "Des pièces de communications utilisant le système de blocs, chaque bloc utilise sa propre grille, et les blocs sont ensuite juxtaposés."], "image": "visuals/63.jpg"}, {"page": 64, "section": "Composition", "title": "7.6 MARGES", "paragraphs": ["Pour déterminer la taille des marges des compositions utilisant le système de blocs, référez-vous à la taille du « O » dans le logo de Royalmount.", "Pour les documents usuels, voici quelques mesures utiles :", "PRÉSENTATION ÉCRAN – 1920 x 1080px Marges : 50 px", "PUBLICATION INSTAGRAM – 1080 x 1080px Marges : 50 px", "FORMAT LETTRE – 8.5 x 11 po Marges : 0.75 po"], "image": "visuals/64.jpg"}, {"page": 65, "section": "Composition", "title": "7.7 EXEMPLE AFFICHAGE", "paragraphs": [], "image": "visuals/65.jpg"}, {"page": 66, "section": "Comp let cycle=0;function generate(){const lang=$('comm-lang').value,theme=$('comm-theme').value,tone=$('comm-tone').value,len=$('comm-length').value,keyword=$('comm-keyword').value.trim();let arr=[...library[lang][theme][len]];if(tone==='poetic')arr=[...arr.slice(2),...arr.slice(0,2)];if(tone==='elegant')arr=[...arr.slice(4),...arr.slice(0,4)];arr=arr.map((_,i)=>arr[(i+cycle)%arr.length]);const target=$('comm-results');target.replaceChildren();arr.forEach((phrase,i)=>{const card=document.createElement('article');card.className='comm-card';const meta=document.createElement('div');meta.className='comm-meta';meta.textContent=`${String(i+1).padStart(2,'0')} / ${tone==='poetic'?'Poétique':tone==='elegant'?'Distingué':'Rassembleur'}`;const title=document.createElement('h3');title.textContent=phrase;const actions=document.createElement('div');actions.className='comm-actions';const copy=document.createElement('button');copy.textContent='Copier';copy.className='secondary';copy.onclick=()=>{navigator.clipboard?.writeText(phrase);copy.textContent='Copié'};const use=document.createElement('button');use.textContent='Utiliser dans une composition';use.onclick=()=>{window.royalSelectedSlogan=phrase;current='Studio de composition';document.body.classList.add("guide-entered");render();window.scrollTo({top:0,behavior:"instant"})};actions.append(copy,use);card.append(meta,title,actions);target.append(card)});if(keyword){const note=document.createElement('p');note.className='comm-disclaimer';note.textContent=`Sujet fourni : « ${keyword} ». Ce générateur local propose des pistes thématiques; il ne sait pas intégrer fidèlement un brief libre. Personnalisez le slogan avant publication.`;target.prepend(note)}}$('comm-generate').onclick=()=>{cycle=(cycle+1)%6;generate()};['comm-lang','comm-theme','comm-tone','comm-length'].forEach(id=>$(id).addEventListener('change',()=>{cycle=0;generate()}));generate();}
