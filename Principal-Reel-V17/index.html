<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Principal — Reel / V19</title><style>
@font-face{font-family:Principal;src:url('StudioPrincipal-SemiBold.otf') format('opentype');font-display:block;font-weight:600;font-style:normal}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:white;font-family:Principal,Arial,sans-serif;font-weight:600;overflow:hidden}button{font:inherit;cursor:pointer}.screen{position:absolute;inset:0;background:#000;overflow:hidden}.video{width:100%;height:100%;object-fit:cover;display:block}.transition{position:absolute;inset:0;overflow:hidden;background:#000;display:none;z-index:3}.scene{position:absolute;width:2276px;height:1280px;left:0;top:0;transform-origin:0 0;overflow:hidden}.green{position:absolute;width:2276px;height:1280px;top:0;left:0;background:var(--accent)}.txt{position:absolute;white-space:nowrap;font-size:80px;line-height:1;font-weight:600;color:white}.principal{left:600px;top:604px}.service{left:996px;top:604px}.name{left:1360px;top:604px}.menu{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}.brand{font-size:16px;margin-bottom:10px}.menu button{border:0;background:transparent;color:#fff;font-size:12px;text-align:left;padding:2px 0;opacity:.58;line-height:1.03;text-shadow:0 1px 8px #0009}.menu button.active{opacity:1}.menu button:hover{opacity:1}.footer{position:absolute;bottom:0;left:0;right:0;z-index:6;background:transparent;padding:0}.navrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:0 26px 16px}.glass{height:56px;position:relative;overflow:hidden;background:rgba(215,220,225,.15);-webkit-backdrop-filter:blur(22px) saturate(145%);backdrop-filter:blur(22px) saturate(145%);border-top:1px solid rgba(255,255,255,.25)}.timeline{height:100%;position:relative;overflow:hidden;cursor:pointer;opacity:1;transition:opacity .2s}.timeline:hover{opacity:1}.strip{display:flex;height:36px;gap:3px;position:absolute;left:50%;top:10px;will-change:transform}.thumb{width:64px;height:36px;flex:none;object-fit:cover;background:#222;opacity:1}.playhead{position:absolute;top:5px;bottom:5px;left:50%;width:2px;background:#f13d30;z-index:2;pointer-events:none}.controls{display:flex;align-items:center;gap:5px;margin:0 0 1px auto;font-size:11px;min-height:25px}.controls button{width:31px;height:31px;border:1px solid rgba(255,255,255,.38);border-radius:2px;background:rgba(0,0,0,.12);color:#fff;padding:6px;display:grid;place-items:center;opacity:.9;transition:background .2s,border-color .2s}.controls button:hover{background:rgba(255,255,255,.17);border-color:#fff}.controls button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.controls button svg.fill{fill:currentColor;stroke:none}.time{opacity:.55;font-variant-numeric:tabular-nums}.hint{display:none}.tag{display:none}@media(max-width:700px){.navrow{padding:0 14px 12px}.menu button{font-size:11px}.brand{font-size:14px;margin-bottom:6px}.glass{height:52px}.strip{top:8px}.hint{display:none}}

/* V12 — quiet controls, larger Swiss navigation, borderless frosted dock */
.brand-top{position:absolute;z-index:7;left:26px;top:24px;font-size:19px;line-height:1;font-weight:600;letter-spacing:-.025em;color:#fff;text-shadow:0 1px 9px rgba(0,0,0,.15);pointer-events:none}

.menu button.active::before{transform:translateY(-50%) scale(1);opacity:1}

.controls button:hover{background:rgba(245,245,245,.3);transform:scale(1.05)}
.controls button svg{width:17px;height:17px}
.glass{height:59px;border:0!important;background:rgba(225,230,233,.20);-webkit-backdrop-filter:blur(28px) saturate(165%) brightness(1.09);backdrop-filter:blur(28px) saturate(165%) brightness(1.09);box-shadow:none}
.strip{top:11px}
.playhead{top:7px;bottom:7px}

/* V13 — reduced frosted rail, left-anchored playhead, precise thumbnail states */
.glass{height:44px!important;background:rgba(225,230,233,.105)!important;-webkit-backdrop-filter:blur(20px) saturate(125%)!important;backdrop-filter:blur(20px) saturate(125%)!important;border:0!important;box-shadow:none!important}
.strip{left:0!important;top:4px!important;gap:4px!important}
.thumb{border-radius:2px!important;opacity:.30!important;transition:opacity .14s linear;display:block}

.glass{height:76px!important;background:rgba(225,230,233,.105)!important}

.playhead{left:150px!important;top:20px!important;bottom:20px!important;width:2px;background:#f13d30}
@media(max-width:700px){.glass{height:76px!important}.strip{top:20px!important}.playhead{left:150px!important}}

/* V16 — compact filmstrip; chapter names float inside the thumbnails rather than in extra padding */
.glass{height:46px!important}
.strip{top:5px!important}
.playhead{left:150px!important;top:5px!important;bottom:5px!important}
.chapter-divider .chapter-label{top:4px!important;left:24px!important;z-index:5!important;padding:3px 5px!important;border-radius:2px!important;background:rgba(0,0,0,.50)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff!important;font-size:10px!important;line-height:1.05!important;text-shadow:0 1px 4px #0009}
@media(max-width:700px){.glass{height:46px!important}.strip{top:5px!important}.playhead{left:150px!important;top:5px!important;bottom:5px!important}}

/* V17 — two image-free slots for each chapter title, keeping timeline geometry intact */

.menu{gap:0!important;align-items:stretch}

.menu{gap:0!important;align-items:stretch!important}

</style></head><body><div class="screen"><video id="reel" class="video" playsinline preload="auto"></video><div class="transition" id="transition"><div class="scene" id="scene"><div class="green" id="green"></div><div class="txt principal" id="principal">Principal</div><div class="txt service" id="service">Service:</div><div class="txt name" id="name">Identité</div></div></div></div><div class="brand-top">Principal</div><div class="footer"><div class="navrow"><nav class="menu"><button data-s="0">Identité visuelle</button><button data-s="1">Expérience numérique</button><button data-s="2">Signalétique</button><button data-s="3">Campagnes</button></nav><div class="controls"><button id="toggle" aria-label="Pause" title="Lecture / pause"></button><button id="mute" aria-label="Couper le son" title="Activer / couper le son"></button></div></div><div class="glass"><div class="timeline" id="timeline"><div class="strip" id="strip"></div><div class="playhead"></div></div></div></div><div class="tag" id="tag"></div><span class="time" id="clock" hidden></span><audio id="transitionAudio" src="reference-audio.mp3" preload="auto"></audio><script src="app.js"></script></body></html>
