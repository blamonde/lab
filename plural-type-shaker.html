<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#87DE2B">
<title>Plural — Foire d'art contemporain</title>
<style>
:root{--green:#87DE2B;--black:#000}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green)}
body{touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--green)}
.obj{
  position:absolute;left:0;top:0;color:#000;white-space:nowrap;
  font-family:"Times New Roman",Times,serif;font-weight:400;
  line-height:.8;letter-spacing:-.055em;transform-origin:center center;
  user-select:none;will-change:transform;
}
.word{font-size:clamp(58px,13vw,158px)}
.paren{font-size:clamp(72px,15vw,180px)}
#permission{
  position:fixed;z-index:30;left:50%;bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);border:1px solid #000;border-radius:999px;
  background:#000;color:var(--green);padding:13px 18px;font:600 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;
}
#permission:active{transform:translateX(-50%) scale(.97)}
</style>
</head>
<body>
<div id="stage"></div>
<button id="permission">Activer le mouvement</button>
<script>
(()=>{
const stage=document.querySelector('#stage'), btn=document.querySelector('#permission');
let W=innerWidth,H=innerHeight,last=performance.now();
let gx=0,gy=0,impX=0,impY=0,lax=0,lay=0;

const specs=[
 ['(Plural)','word',.27,.09,-.12],
 ["(Foire d’art)",'word',.59,.24,-.13],
 ['(','paren',.52,.38,-.05], [')','paren',.83,.40,.03],
 [')','paren',.70,.49,.06], ['(','paren',.12,.59,-.13],
 ['(','paren',.20,.62,-.12],
 ['(Contemporain)','word',.48,.76,.15],
 ['(','paren',.60,.69,-.03], [')','paren',.88,.69,.01],
 ['(','paren',.27,.86,-.02], [')','paren',.39,.86,.01]
];
const items=[];

function make(){
 stage.innerHTML='';items.length=0;
 specs.forEach(([txt,cls,nx,ny,ang],i)=>{
   const el=document.createElement('div'); el.className='obj '+cls; el.textContent=txt; stage.appendChild(el);
   const r=el.getBoundingClientRect();
   items.push({el,w:r.width,h:r.height,x:nx*W-r.width/2,y:ny*H-r.height/2,
     vx:0,vy:0,a:ang,va:0,m:Math.max(1,r.width*r.height/8000)});
 });
}
function fit(p){
 p.x=Math.max(2,Math.min(W-p.w-2,p.x)); p.y=Math.max(2,Math.min(H-p.h-2,p.y));
}
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;make()});

async function enable(){
 try{
   if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
     if(await DeviceMotionEvent.requestPermission()!=='granted') throw 0;
   }
   addEventListener('devicemotion',motion,{passive:true});btn.remove();
 }catch(e){btn.textContent='Autoriser le mouvement dans Safari'}
}
btn.onclick=enable;

function motion(e){
 const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
 // gravity follows phone tilt; sudden acceleration produces a box-shake impulse
 gx=(a.x||0)*75; gy=-(a.y||0)*75;
 const pure=e.acceleration;
 if(pure){
   const x=pure.x||0,y=pure.y||0;
   impX=Math.max(-1400,Math.min(1400,impX+(x-lax)*55));
   impY=Math.max(-1400,Math.min(1400,impY-(y-lay)*55));
   lax=x;lay=y;
 }
}

// mouse/touch drag gives a quick desktop preview
let px=null,py=null;
addEventListener('pointermove',e=>{
 if(px!==null){impX+=(e.clientX-px)*10;impY+=(e.clientY-py)*10}
 px=e.clientX;py=e.clientY;
});

function loop(t){
 const dt=Math.min(.022,(t-last)/1000);last=t;
 for(const p of items){
   p.vx+=(gx+impX)*dt;p.vy+=(gy+impY)*dt;
   p.vx*=.992;p.vy*=.992;p.va*=.994;
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
   const maxX=W-p.w,maxY=H-p.h,R=.62;
   if(p.x<0){p.x=0;p.vx=Math.abs(p.vx)*R;p.va+=(Math.random()-.5)*1.1}
   if(p.x>maxX){p.x=maxX;p.vx=-Math.abs(p.vx)*R;p.va+=(Math.random()-.5)*1.1}
   if(p.y<0){p.y=0;p.vy=Math.abs(p.vy)*R;p.va+=(Math.random()-.5)*1.1}
   if(p.y>maxY){p.y=maxY;p.vy=-Math.abs(p.vy)*R;p.va+=(Math.random()-.5)*1.1}
 }
 // Approximate rigid-body collisions between typographic objects.
 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
   const a=items[i],b=items[j], acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2;
   const ox=(a.w+b.w)*.43-Math.abs(acx-bcx), oy=(a.h+b.h)*.34-Math.abs(acy-bcy);
   if(ox>0&&oy>0){
     if(ox<oy){const s=acx<bcx?-1:1;a.x+=s*ox*.5;b.x-=s*ox*.5;let v=a.vx;a.vx=b.vx*.72;b.vx=v*.72}
     else{const s=acy<bcy?-1:1;a.y+=s*oy*.5;b.y-=s*oy*.5;let v=a.vy;a.vy=b.vy*.72;b.vy=v*.72}
     a.va+=(Math.random()-.5)*.65;b.va+=(Math.random()-.5)*.65;
   }
 }
 for(const p of items){fit(p);p.el.style.transform=`translate3d(${p.x}px,${p.y}px,0) rotate(${p.a}rad)`}
 impX*=.87;impY*=.87;requestAnimationFrame(loop);
}
make();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
